name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: V3 plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out plugin repository
        uses: actions/checkout@v4
        with:
          path: MoviePilot-Plugins
          fetch-depth: 0

      - name: Check out official MoviePilot V3 host
        uses: actions/checkout@v4
        with:
          repository: jxxghp/MoviePilot
          ref: v3
          path: MoviePilot

      - name: Set up locked V3 host environment
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version-file: MoviePilot/pyproject.toml
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            MoviePilot/pyproject.toml
            MoviePilot/uv.lock

      - name: Install official host dependencies from uv.lock
        working-directory: MoviePilot
        run: uv sync --locked

      - name: Run repository and V3 tests in isolated sessions
        working-directory: MoviePilot-Plugins
        env:
          MOVIEPILOT_BACKEND_PATH: ${{ github.workspace }}/MoviePilot
        run: ../MoviePilot/.venv/bin/python tests/run.py

      - name: Validate V3 manifest JSON
        working-directory: MoviePilot-Plugins
        run: ../MoviePilot/.venv/bin/python -m json.tool package.v3.json >/dev/null

      - name: Check canonical shared module mirrors
        working-directory: MoviePilot-Plugins
        run: ../MoviePilot/.venv/bin/python tools/sync_shared_modules.py --check

      - name: Check patch whitespace
        working-directory: MoviePilot-Plugins
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -eu
          zero_sha=0000000000000000000000000000000000000000

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_sha="$BASE_SHA"
            head_sha="$HEAD_SHA"
          else
            base_sha="$BEFORE_SHA"
            head_sha="$AFTER_SHA"
          fi

          if [ "$base_sha" = "$zero_sha" ]; then
            if git rev-parse --verify "$head_sha^" >/dev/null 2>&1; then
              base_sha="$(git rev-parse "$head_sha^")"
            else
              git diff --check --root "$head_sha"
              exit 0
            fi
          fi

          git diff --check "$base_sha" "$head_sha"
